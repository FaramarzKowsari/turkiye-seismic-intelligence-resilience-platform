name: Optional live USGS snapshot

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback days"
        required: true
        default: "7"
      min_magnitude:
        description: "Minimum magnitude"
        required: true
        default: "2.0"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Build live snapshot exports
        run: depremnabiz live --days ${{ inputs.days }} --min-magnitude ${{ inputs.min_magnitude }} --output outputs/live
      - uses: actions/upload-artifact@v4
        with:
          name: usgs-turkiye-live-snapshot
          path: outputs/live
