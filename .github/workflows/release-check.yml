name: Release validation

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,app]"
      - run: python scripts/generate_demo.py
      - run: pytest
      - run: ruff check .
      - run: python scripts/release_audit.py
